<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline</title>
  <style>
    body { margin:0; background:#f4f6f8; color:#1a2330; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Georgian",sans-serif; }
    .wrap { max-width:480px; margin:80px auto; padding:16px; }
    .card { background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:24px; text-align:center; }
    .big { font-size:2.4rem; }
    h1 { font-size:1.3rem; margin:8px 0; }
    p { color:#64748b; }
    a { display:inline-block; margin-top:12px; background:#2563eb; color:#fff; text-decoration:none; padding:12px 20px; border-radius:10px; font-weight:600; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="big">📡</div>
      <h1>ინტერნეტი არ არის / No internet connection</h1>
      <p>სკანირება ვერ ჩაიწერება ინტერნეტის გარეშე. შეამოწმეთ კავშირი და სცადეთ თავიდან.<br>
         The scan cannot be recorded without internet. Check the connection and tap the tag again.</p>
      <a href="/walk">თავიდან ცდა / Retry</a>
    </div>
  </div>
</body>
</html>
