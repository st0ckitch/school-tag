<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef2f9">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1220">
  <title>Offline</title>
  <style>
    @font-face { font-family:'ST Sans'; src:url('/fonts/PlusJakartaSans.woff2') format('woff2'); font-weight:200 800; font-display:swap;
      unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
    @font-face { font-family:'ST Sans'; src:url('/fonts/NotoSansGeorgian.woff2') format('woff2'); font-weight:100 900; font-display:swap;
      unicode-range:U+0589, U+10A0-10FF, U+1C90-1CBA, U+1CBD-1CBF, U+205A, U+2D00-2D2F, U+2E31; }
    :root {
      --bg:#eef2f9; --text:#17223b; --muted:#5b6b85;
      --card-bg:rgba(255,255,255,.55); --card-border:rgba(255,255,255,.72);
      --shadow:0 8px 32px rgba(23,37,84,.10);
      --glow-1:rgba(99,102,241,.16); --glow-2:rgba(56,189,248,.14);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#0b1220; --text:#e6ecf7; --muted:#93a4bf;
        --card-bg:rgba(24,33,56,.55); --card-border:rgba(148,163,184,.18);
        --shadow:0 8px 32px rgba(0,0,0,.38);
        --glow-1:rgba(99,102,241,.28); --glow-2:rgba(14,165,233,.18);
      }
    }
    body { margin:0; background:var(--bg); color:var(--text); min-height:100vh;
           font-family:'ST Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Georgian",sans-serif; }
    body::before { content:""; position:fixed; inset:0; z-index:-1;
      background:radial-gradient(620px 440px at 10% -6%,var(--glow-1),transparent 62%),
                 radial-gradient(540px 400px at 106% 14%,var(--glow-2),transparent 62%); }
    .wrap { max-width:480px; margin:80px auto; padding:16px; }
    .card { background:var(--card-bg); border:1px solid var(--card-border); border-radius:20px;
            padding:26px; text-align:center; box-shadow:var(--shadow);
            -webkit-backdrop-filter:blur(22px) saturate(160%); backdrop-filter:blur(22px) saturate(160%); }
    .big { font-size:2.4rem; }
    h1 { font-size:1.3rem; margin:8px 0; letter-spacing:-.02em; }
    p { color:var(--muted); line-height:1.55; }
    a { display:inline-block; margin-top:12px; background:linear-gradient(135deg,#3b82f6,#6366f1);
        color:#fff; text-decoration:none; padding:13px 22px; border-radius:14px; font-weight:650;
        box-shadow:0 6px 18px rgba(59,130,246,.35); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="big">📡</div>
      <h1>ინტერნეტი არ არის / No internet connection</h1>
      <p>სკანირება ვერ ჩაიწერება ინტერნეტის გარეშე. შეამოწმეთ კავშირი და სცადეთ თავიდან.<br>
         The scan cannot be recorded without internet. Check the connection and tap the tag again.</p>
      <a href="/walk">თავიდან ცდა / Retry</a>
    </div>
  </div>
</body>
</html>
