plugins {
    id 'com.android.application'
}

// Passed by the build (see .github/workflows/android-apk.yml):
//   -PappUrl=https://your-deployed-app   -PappPackage=com.schooltag.app
def appUrl = (findProperty('appUrl') ?: 'https://school-tag.example.com').toString().replaceAll('/+$', '')
def appHost = new URI(appUrl).host
def appPackage = (findProperty('appPackage') ?: 'com.schooltag.app').toString()

android {
    namespace 'com.schooltag.app'
    compileSdk 34

    defaultConfig {
        applicationId appPackage
        minSdk 24
        targetSdk 34
        versionCode (findProperty('versionCode') ?: '1').toString().toInteger()
        versionName (findProperty('versionName') ?: '1.0').toString()
        manifestPlaceholders = [appUrl: appUrl, appHost: appHost]
        resValue "string", "app_url", appUrl
        // Digital Asset Links statement pointing back at the site.
        resValue "string", "asset_statements",
            '[{\\"relation\\": [\\"delegate_permission/common.handle_all_urls\\"], ' +
            '\\"target\\": {\\"namespace\\": \\"web\\", \\"site\\": \\"' + appUrl + '\\"}}]'
    }

    signingConfigs {
        release {
            if (findProperty('storeFile')) {
                storeFile file(findProperty('storeFile'))
                storePassword findProperty('storePassword')
                keyAlias findProperty('keyAlias')
                keyPassword findProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (findProperty('storeFile')) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
